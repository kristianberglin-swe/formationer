<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formationer 2.0</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#0c141b;color:#f1f6fa}
*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:#142330;border-bottom:1px solid #354b5b}
header strong{font-size:21px;letter-spacing:1px;margin-right:auto}
button{background:#26485b;border:1px solid #5a7787;color:white;padding:10px 15px;border-radius:9px;font-size:14px;cursor:pointer}
button:hover{background:#37617a}button.active{background:#e3ae54;color:#101923;border-color:#e3ae54;font-weight:750}
button:disabled{opacity:.5;cursor:not-allowed}
#home{max-width:900px;margin:9vh auto;text-align:center;padding:24px;position:relative;z-index:1}
body:has(#home:not([style*="display: none"]))::before{content:"";position:fixed;inset:0;background:url('https://kristianberglin-swe.github.io/formationer/formationer-startbild-ny.jpg') center/cover no-repeat;z-index:0;pointer-events:none}
header{position:relative;z-index:2}#app{position:relative;z-index:1}
#home h1{text-shadow:0 4px 16px #000}
#home p{text-shadow:0 2px 7px #000}#home h1{font-size:clamp(32px,5vw,56px);margin:0 0 10px}#home p{color:#a9c0cd}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:38px auto}
.choice{padding:45px 15px;font-size:23px;background:#1b3545;border:1px solid #526e7b}
.choice span{display:block;font-size:14px;color:#b6c7d0;margin-top:14px;font-weight:400}
#app{display:none}iframe{display:block;border:0;width:100%;height:calc(100dvh - 69px);background:#111a20}
#notice{font-size:12px;color:#d3e2ea}input[type=file]{display:none}
dialog{border:1px solid #607c8c;border-radius:15px;background:#172835;color:white;max-width:400px;width:calc(100% - 30px);padding:26px}
dialog::backdrop{background:#000b}dialog input{width:100%;padding:12px;background:#081720;border:1px solid #6b8796;color:white;border-radius:7px;font-size:18px;margin:10px 0}
dialog p{color:#b9cad4}#error{color:#ffaaa2;min-height:18px}
@media(max-width:700px){.choices{grid-template-columns:1fr}header{gap:6px}header strong{width:100%}button{padding:9px}iframe{height:calc(100dvh - 115px)}}

/* Startskärmen är själva originalbilden: klickbar STARTA och diskret ADMIN. */
body:has(#home:not([style*="display: none"])) header{display:none}
#home{position:fixed;inset:0;max-width:none;margin:0;padding:0;z-index:3;pointer-events:none}
#imageStart{appearance:none!important;box-shadow:none!important;outline:none!important;position:absolute;left:33%;width:34%;bottom:0.3%;height:15%;border:0!important;background:transparent!important;color:transparent!important;font-size:0!important;cursor:pointer;pointer-events:auto}
#imageStart:hover{background:transparent;box-shadow:none;border:0;outline:0}
#imageAdmin{position:absolute;right:14px;top:14px;padding:7px 11px;font-size:12px;background:#0c1a24aa;border:1px solid #60758466;border-radius:7px;opacity:.7;pointer-events:auto}
#imageAdmin:hover{opacity:1;background:#142c3b}
#imageAdmin span{font-size:11px}
@media(max-width:700px){#imageStart{left:20%;width:60%;height:17%}#imageAdmin{right:9px;top:9px}}
</style></head><body>
<header style="display: flex;"><strong>FORMATIONER 2.0</strong><button id="homeBtn">Startsida</button><button id="viewBtn" style="display:none" class="">Visning</button><button id="adminBtn" style="display:none" class="active">Admin</button><button id="exportBtn" style="">Exportera index.html</button><button id="backupBtn" style="">Säkerhetskopia JSON</button><button id="importBtn" style="">Importera JSON</button><input id="fileInput" type="file" accept=".json,application/json"></header>
<main id="home" aria-label="Startskärm" style="display: none;">
<button id="imageStart" type="button" aria-label="Starta visningsprogrammet" title="Starta visningsprogrammet"></button>
<button id="imageAdmin" type="button" aria-label="Öppna admin" title="Admin">⚙ <span>Admin</span></button>
</main>

<script>
const $=id=>document.getElementById(id);
const decode=id=>decodeURIComponent(escape(atob($(id).textContent.trim())));
const encode=s=>btoa(unescape(encodeURIComponent(s)));
let adminSource=decode('adminData'),viewerSource=decode('viewerData');
let adminFrame=null,mode='',unlocked=false;
const KEY='formationer-2-projects';
const start=viewerSource.indexOf('const PROJECTS=')+'const PROJECTS='.length;
const initial=JSON.parse(viewerSource.slice(start,viewerSource.indexOf(';',start)));
let published=initial;
/* Publicerad data kommer alltid från index.html, inte från gamla webbläsarversioner. */
function onlyActiveVersions(list){
 const groups=new Map();
 for(const p of list){
  const name=String(p.moment||p.name||'').trim().replace(/\s*\((?:kopia|version\s*\d+|v\s*\d+|återställd[^)]*)\)\s*$/i,'').replace(/\s*[-–]\s*(?:version|v)\s*\d+$/i,'').trim();
  const key=(p.category||'Formationer')+'::'+name.toLocaleLowerCase('sv');
  if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p);
 }
 return [...groups.values()].map(g=>g.find(p=>p.activeVersion===true)).filter(Boolean);
}
function replaceViewer(list){list=onlyActiveVersions(list);
 const p=viewerSource.indexOf('const PROJECTS=')+'const PROJECTS='.length;
 const e=viewerSource.indexOf(';const $=',p);
 return viewerSource.slice(0,p)+JSON.stringify(list)+viewerSource.slice(e);
}
function replaceAdmin(list){
 const start='<script type="application/json" id="initialProjects">';
 const i=adminSource.indexOf(start)+start.length,j=adminSource.indexOf('<\/script>',i);
 return adminSource.slice(0,i)+JSON.stringify(list).replaceAll('<','\\u003c')+adminSource.slice(j);
}
function getProjects(){
 try{if(adminFrame&&adminFrame.contentWindow&&adminFrame.contentWindow.formationerGetProjects)
 return adminFrame.contentWindow.formationerGetProjects()}catch(e){}
 return published;
}
function download(name,data,mime){
 const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function setMode(next){
 mode=next;document.querySelector('header').style.display=next?'flex':'none';$('home').style.display=next?'none':'block';$('app').style.display=next?'block':'none';
 $('viewBtn').classList.toggle('active',next==='view');$('adminBtn').classList.toggle('active',next==='admin');
 for(const id of ['exportBtn','backupBtn','importBtn'])$(id).style.display=next==='admin'?'':'none';
 if(!next){$('frame').srcdoc='';adminFrame=null;return}
 if(next==='view'){
   if(adminFrame)published=getProjects();
   const byId=new Map(published.map(p=>[p.id,p]));
   published=published;
   $('frame').onload=()=>{try{const d=$('frame').contentDocument;const area=d.getElementById('workMain'),view=d.getElementById('viewer'),welcome=d.getElementById('welcome'),workspace=d.getElementById('workspace');if(area&&view){area.appendChild(view);view.style.display='block';}if(workspace)workspace.style.display='flex';if(welcome)welcome.style.display='none';const active=d.querySelector('#scene');if(active&&!active.innerHTML.trim()){const script=d.createElement('script');script.textContent='if(typeof render==="function")render();';d.body.appendChild(script)}}catch(e){console.error('Visning kunde inte visas',e)}};$('frame').srcdoc=replaceViewer(published);adminFrame=null;
 }
 else{
   const byId=new Map(published.map(p=>[p.id,p]));
   published=published;
   $('frame').srcdoc=replaceAdmin(published);
   adminFrame=$('frame');
 }
}
function openAdmin(){if(unlocked){setMode('admin');return}$('password').value='';$('error').textContent='';$('passwordDialog').showModal();$('password').focus()}
document.querySelector('header').style.display='none';
$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('password').value==='xxx'){unlocked=true;$('passwordDialog').close();setMode('admin')}else{$('error').textContent='Fel lösenord';$('password').value=''}});
$('cancel').onclick=()=>$('passwordDialog').close();
$('homeBtn').onclick=()=>{if(mode==='admin')saveWorking();setMode('')};
$('viewBtn').onclick=()=>{if(mode==='admin')saveWorking();setMode('view')};
$('imageStart').onclick=()=>setMode('view');
$('adminBtn').onclick=openAdmin;$('imageAdmin').onclick=openAdmin;
function saveWorking(){published=getProjects();try{localStorage.setItem(KEY,JSON.stringify(published))}catch(e){}}
window.addEventListener('message',event=>{
 if(event.source!==$('frame').contentWindow)return;
 const data=event.data;
 if(!data||data.type!=='formationer2-projects-updated'||!Array.isArray(data.projects))return;
 if(!data.projects.every(p=>p&&typeof p.id==='string'&&Array.isArray(p.people)))return;
 published=data.projects;
 try{localStorage.setItem(KEY,JSON.stringify(published))}catch(e){console.warn(e)}
});

$('backupBtn').onclick=()=>{saveWorking();download('formationer-sakerhetskopia.json',JSON.stringify({version:1,projects:published},null,2),'application/json')};
$('exportBtn').onclick=()=>{
 saveWorking();
 const doc=document.documentElement.cloneNode(true);
 doc.querySelector('#frame').removeAttribute('srcdoc');
 doc.querySelector('#adminData').textContent=encode(replaceAdmin(published));
 doc.querySelector('#viewerData').textContent=encode(replaceViewer(published));
 const result='<!doctype html>\n'+doc.outerHTML;
 download('index.html',result,'text/html;charset=utf-8');
};
$('importBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const data=JSON.parse(await file.text());const list=Array.isArray(data)?data:data.projects;
 if(!Array.isArray(list)||!list.every(p=>p&&p.id&&Array.isArray(p.people)))throw Error('JSON-filen saknar giltiga formationer');
 if(!confirm('Importera '+list.length+' formationer och ersätta den aktuella listan?'))return;
 published=list;localStorage.setItem(KEY,JSON.stringify(list));
 if(adminFrame&&adminFrame.contentWindow.formationerSetProjects)adminFrame.contentWindow.formationerSetProjects(list);
 alert('Importerade '+list.length+' formationer.');
 }catch(err){alert('Import misslyckades: '+err.message)}finally{e.target.value=''}
};
</script></body></html>
